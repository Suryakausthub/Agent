# Job Agent configuration.
# Everything tunable lives here so scoring stays reproducible and auditable
# rather than drifting with prompt changes.

llm:
  # Groq, OpenAI-compatible endpoint. Key is read from GROQ_API_KEY.
  base_url: "https://api.groq.com/openai/v1"
  model: "openai/gpt-oss-120b"
  # Must be a model this API key can actually reach. llama-3.3-70b-versatile
  # is listed as a production model in Groq's public docs but returns 404 on
  # this account, so the fallback path was dead until it was exercised.
  # verify_models below checks this at startup rather than at failure time.
  fallback_model: "openai/gpt-oss-20b"
  verify_models: true
  temperature: 0.0          # spec 15.7 - never vary content selection
  max_tokens: 4096
  reasoning_effort: "low"   # raised per-call for relevance explanations
  request_timeout_s: 90
  max_retries: 3

# Spec section 3. Weights must sum to 1.0; the score is computed in code and
# only the *explanation* is ever generated by the model.
scoring:
  weights:
    required_skills: 0.50
    preferred_skills: 0.20
    project_relevance: 0.20
    qualifications: 0.10
  # A skill counts as Strong at >= strong, Partial at >= partial, else Missing.
  thresholds:
    strong: 0.85
    partial: 0.50

# Spec section 13 + the agreed trim policy.
resume:
  max_pages: 1
  # The master resume renders as exactly one page in Overleaf. The stub
  # compiler calibrates its page budget from this fact rather than from
  # guessed paper geometry, so the question it answers is "has tailoring made
  # this taller than the master?" -- which it can answer reliably.
  master_known_pages: 1
  # Render/compile cycles, not rules. The cut order has four rules and several
  # can fire repeatedly (multiple skill lines, multiple bullets), so a budget
  # of 3 stops the loop long before it reaches the project cut that actually
  # frees a page. Rule exhaustion is the real stopping condition; this is only
  # a guard against a misbehaving rule.
  max_trim_attempts: 14
  max_projects: 3
  min_projects: 2
  # Never removed under space pressure.
  protected_sections:
    - Summary            # may be shortened, never deleted
    - Education
    - Certifications & Achievements
    - Research Publications
  # Cut order when the render overflows. Earlier entries are cut first.
  trim_order:
    - summary_condense
    - skills_lowest_relevance
    - project_lowest_relevance
    - experience_bullet_lowest_relevance
  # Cosmetic cheating is forbidden (spec 13).
  min_font_pt: 11
  min_margin_in: 0.5

# Project Knowledge Base (knowledge_base.py, project_select.py). Built once
# per repository by scripts/build_knowledge_base.py; per job, the selector
# ranks these together with the main.tex projects and takes at most
# max_bullets_per_project of each project's ten candidate bullets.
project_bank:
  enabled: true
  # Every analysed project is used automatically, except ones you mark
  # "Don't use" in the Project Library. true = only projects you approve.
  require_approval: false
  # Projects whose authorship looks uncertain (fork, downloaded archive,
  # someone else's go.mod) stay out until you confirm them ("Use anyway").
  exclude_flagged: true
  max_bullets_per_project: 3
  # One model call picks projects/bullets from this many code-ranked
  # candidates; false uses the code ranking alone.
  model_selection: true
  candidates_for_model: 6

# Spec section 15. The whitelist is built from the master resume + project
# bank; anything outside it in generated text is flagged, never auto-accepted.
guardrails:
  summary_rewritable: true        # whitelist-checked; pending user confirmation
  block_generated_numbers: true   # numbers are masked before the call
  require_human_approval: true    # spec 17 - no bypass
  max_new_terms: 0

compile:
  # Tectonic compiles the tailored .tex to a real PDF and MEASURES its pages.
  # The binary lives in the project (relative to the project root); LaTeX
  # packages are downloaded on first use and cached.
  backend: "tectonic"             # stub | tectonic
  tectonic_path: "tools/tectonic/tectonic.exe"
  # If Tectonic cannot run, use the calibrated estimate instead of failing
  # the run. The result is still labelled "estimated" everywhere.
  fallback_to_stub: true
  bundle_path: ""                 # local bundle tar, once pre-seeded
  timeout_s: 120

paths:
  master_resume: "../main.tex"
  database: "../job_agent.db"
  vocabulary: "vocabulary.yaml"
  output_dir: "../output"

# Spec section 18 - reusable candidate context, so it is not re-entered per
# application. Used to sign off referral messages.
candidate:
  name: "A. Surya Kausthub"
  email: "kausthubsurya@gmail.com"
  standing: "B.Tech Computer Science graduate (2026)"
  linkedin: "https://www.linkedin.com/in/surya-kausthub-85352b274/"
  github: "https://github.com/Suryakausthub"

targets:
  # Drives vocabulary generation and relevance weighting.
  roles:
    - backend_sde
    - data_platform
    - ai_ml
